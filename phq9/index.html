<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HEAL PHQ-9 Depression Screening</title>
  <meta name="description" content="Patient Health Questionnaire 9 (PHQ-9) - screening tool for depression severity.">
  <link rel="stylesheet" href="phq9.css">
</head>
<body>
  <main id="heal-root" aria-label="PHQ-9 depression screening questionnaire"></main>

  <script src="../allowed-domains.js"></script>
  <script src="../shared/embed-guard.js"></script>
  <script src="phq9.js"></script>
  <script>
    (function () {
      var root = document.getElementById("heal-root");
      var verdict = window.healEmbedGuard.checkIframe();
      if (verdict.allowed) {
        window.healRenderPHQ9(root);
      } else {
        root.innerHTML =
          '<p style="font-family:system-ui,sans-serif;color:#888;padding:12px;">' +
          "This questionnaire is not available on this site.</p>";
      }
    })();
  </script>
</body>
</html>
